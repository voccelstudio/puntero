<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40" aria-label="Puntero">
  <!-- Sello circular oscuro -->
  <circle cx="50" cy="50" r="48" fill="#0f172a"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Llana detrás (diagonal -30°) -->
  <g transform="translate(50 50) rotate(-30)">
    <path d="M -28 -2 L 28 -2 L 22 16 L -22 16 Z" fill="#f59e0b" stroke="#c2410c" stroke-width="0.8"/>
    <rect x="-3" y="-15" width="6" height="14" rx="1" fill="#78350f"/>
  </g>

  <!-- Casco blanco al frente -->
  <g transform="translate(50 50)">
    <ellipse cx="0" cy="8" rx="20" ry="3" fill="#e2e8f0"/>
    <path d="M -18 8 Q -18 -12 0 -12 Q 18 -12 18 8 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <path d="M -8 -7 Q 0 -10 8 -7" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="-13" cy="3" r="1.3" fill="#94a3b8"/>
    <circle cx="13" cy="3" r="1.3" fill="#94a3b8"/>
  </g>
</svg>
