name: CI

on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          # No publicar artefactos internos ni datos de ejemplo
          exclude_assets: |
            .github
            .eslintrc.json
            .firebaserc
            .gitignore
            .prettierrc
            tests
            examples
            tools
            CHANGELOG.md
            package.json
            package-lock.json
            firebase.json
            firestore.rules
            storage.rules
