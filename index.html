<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Puntero — Construction Finance</title>
  <meta name="description" content="Tu obra, tu mando. Presupuestos, cronogramas y gestión integral de obra hecho en Paraguay.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <meta name="theme-color" content="#051426">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Puntero">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display:wght@700;800&family=Sora:wght@400;700;800&family=Barlow+Condensed:wght@400;700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app-layout">
  <aside class="sidebar">
    <div class="side-logo" onclick="setSection('global_dashboard')">
      <div class="logo">
        <svg class="logo-mark" viewBox="0 0 36 36" width="36" height="36" aria-label="Puntero">
          <rect width="36" height="36" rx="8" fill="var(--acc)"/>
          <path d="M8 26V10l10 4v8l-10 4zm12-12l8-4v16l-8-4V14z" fill="var(--bg)" opacity=".9"/>
        </svg>
        <div class="logo-text">
          <div class="logo-name">PUNTERO</div>
          <div class="logo-tag">Construction Finance</div>
        </div>
      </div>
    </div>
    
    <div class="side-scroll">
      <div class="nav-group">
        <div class="nav-label">Principal</div>
        <button id="btn-global_dashboard" class="nbtn on" onclick="setSection('global_dashboard')"><span class="material-symbols-outlined">dashboard</span> Panel General</button>
        <button id="btn-projects" class="nbtn" onclick="setSection('projects')"><span class="material-symbols-outlined">apartment</span> Mis Proyectos</button>
        <button id="btn-budget" class="nbtn" onclick="setSection('budget')"><span class="material-symbols-outlined">request_quote</span> Presupuesto</button>
        <button id="btn-computo" class="nbtn" onclick="setSection('computo')"><span class="material-symbols-outlined">calculate</span> Cómputo</button>
        <button id="btn-prices" class="nbtn" onclick="setSection('prices')"><span class="material-symbols-outlined">payments</span> Base de Precios</button>
      </div>

      <div class="nav-group">
        <div class="nav-label">Seguimiento</div>
        <button id="btn-dashboard" class="nbtn" onclick="setSection('dashboard')"><span class="material-symbols-outlined">monitoring</span> Resumen Obra</button>
        <button id="btn-schedule" class="nbtn" onclick="setSection('schedule')"><span class="material-symbols-outlined">calendar_month</span> Cronograma</button>
        <button id="btn-logs" class="nbtn" onclick="setSection('logs')"><span class="material-symbols-outlined">menu_book</span> Libro de Obra</button>
        <button id="btn-aftercare" class="nbtn" onclick="setSection('aftercare')"><span class="material-symbols-outlined">build</span> Garantía</button>
        <button id="btn-materials" class="nbtn" onclick="setSection('materials')"><span class="material-symbols-outlined">inventory_2</span> Materiales</button>
        <button id="btn-contractors" class="nbtn" onclick="setSection('contractors')"><span class="material-symbols-outlined">engineering</span> Contratistas</button>
      </div>

      <div class="nav-group">
        <div class="nav-label">Gestión</div>
        <button id="btn-finances" class="nbtn" onclick="setSection('finances')"><span class="material-symbols-outlined">account_balance_wallet</span> Finanzas</button>
        <button id="btn-performance" class="nbtn" onclick="setSection('performance')"><span class="material-symbols-outlined">trending_up</span> Desempeño</button>
        <button id="btn-documents" class="nbtn" onclick="setSection('documents')"><span class="material-symbols-outlined">folder_open</span> Planos y Fotos</button>
        <button id="btn-suppliers" class="nbtn" onclick="setSection('suppliers')"><span class="material-symbols-outlined">local_shipping</span> Proveedores</button>
      </div>

      <div class="nav-group" style="margin-top:auto; padding-top:12px; border-top:1px solid var(--bor)">
        <button id="btn-themes" class="nbtn" onclick="setSection('themes')"><span class="material-symbols-outlined">palette</span> Temas</button>
        <button class="nbtn" onclick="showModal('profile')"><span class="material-symbols-outlined">person</span> Mi Perfil</button>
      </div>
    </div>

    <div class="side-footer">
      <button class="btn ok-btn full" onclick="showModal('export_project')"><span class="material-symbols-outlined" style="font-size:18px">upload</span> Enviar Proyecto</button>
      <button class="btn pdf-btn full" onclick="generarPDF()"><span class="material-symbols-outlined" style="font-size:18px">picture_as_pdf</span> Generar PDF</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <button class="drawer-toggle" onclick="toggleSidebar()" aria-label="Menú">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div id="view-title" style="font-family:var(--font-display); font-size:1.15rem; font-weight:700; color:var(--tx); flex:1">Panel General</div>
      <div style="display:flex; align-items:center; gap:12px">
        <div id="currency-area" style="display:flex; align-items:center; gap:10px"></div>
        <button class="btn sm" onclick="showModal('profile')" style="padding:6px; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center">
          <span class="material-symbols-outlined" style="font-size:18px">person</span>
        </button>
      </div>
    </div>
    <div id="section-budget" class="view" style="display:none">
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-bottom:10px">
            <button class="btn sm" onclick="saveVersion()"><span class="material-symbols-outlined" style="font-size:16px">save</span> Guardar</button>
            <button class="btn sm" onclick="showModal('load_version')"><span class="material-symbols-outlined" style="font-size:16px">history</span> Historial</button>
        </div>
        <div id="budget-main-area"></div>
    </div>
    <div id="section-global_dashboard" class="view" style="display:none"></div>
    <div id="section-projects" class="view" style="display:none"></div>
    <div id="section-computo" class="view" style="display:none"></div>
    <div id="section-aftercare" class="view" style="display:none"></div>
    <div id="section-schedule" class="view" style="display:none"></div>
    <div id="section-logs" class="view" style="display:none"></div>
    <div id="section-materials" class="view" style="display:none"></div>
    <div id="section-contractors" class="view" style="display:none"></div>
    <div id="section-finances" class="view" style="display:none"></div>
    <div id="section-performance" class="view" style="display:none"></div>
    <div id="section-dashboard" class="view" style="display:none"></div>
    <div id="section-prices" class="view" style="display:none"></div>
    <div id="section-themes" class="view" style="display:none"></div>
    <div id="section-documents" class="view" style="display:none"></div>
    <div id="section-suppliers" class="view" style="display:none"></div>
    <div id="section-resources" class="view" style="display:none"></div>
  </main>
</div>

<div id="drawer-overlay" class="drawer-overlay" onclick="toggleSidebar()"></div>
<div id="modal-area"></div>
<div id="toast-el" class="toast" style="display:none"></div>

<div class="mobile-fab">
  <div id="fab-items" class="mobile-fab-items closed">
    <div class="mobile-fab-item" onclick="setSection('logs');closeFab()"><span class="material-symbols-outlined" style="font-size:18px">menu_book</span> Libro de Obra</div>
    <div class="mobile-fab-item" onclick="setSection('materials');closeFab()"><span class="material-symbols-outlined" style="font-size:18px">inventory_2</span> Materiales</div>
    <div class="mobile-fab-item" onclick="setSection('contractors');closeFab()"><span class="material-symbols-outlined" style="font-size:18px">engineering</span> Contratistas</div>
    <div class="mobile-fab-item" onclick="setSection('documents');closeFab()"><span class="material-symbols-outlined" style="font-size:18px">folder_open</span> Fotos</div>
    <div class="mobile-fab-item" onclick="generarPDF();closeFab()" style="color:var(--acc)"><span class="material-symbols-outlined" style="font-size:18px">picture_as_pdf</span> PDF</div>
  </div>
  <button id="fab-btn" class="mobile-fab-main" onclick="toggleFab()" aria-label="Acciones rápidas">
    <span class="material-symbols-outlined" style="font-size:24px">bolt</span>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script src="db_precios.js"></script>
<script src="app.js"></script>
<script src="schedule.js"></script>
<script src="logs.js"></script>
<script src="contractors.js"></script>
<script src="materials.js"></script>
<script src="finances.js"></script>
<script src="performance.js"></script>
<script src="documents.js"></script>
<script src="suppliers.js"></script>
<script src="resources.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW?.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            if (typeof toast === 'function') toast('Nueva versión disponible. Recargá la app para actualizar.');
          }
        });
      });
    }).catch(err => console.warn('[SW] Registro falló:', err));
  });
}
</script>

</body>
</html>
